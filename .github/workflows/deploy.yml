name: Deploy

on:
  push:
    branches: [main]
    paths: ["src/**", "infra/terraform/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write # OIDC token exchanged for short-lived AWS credentials
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Terraform apply
    # Skipped until the AWS bootstrap has been applied and the repository variables are set.
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infra/terraform
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Init
        run: >
          terraform init -input=false
          -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          -backend-config="key=app/terraform.tfstate"
          -backend-config="region=${{ vars.AWS_REGION }}"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"

      - name: Plan
        run: terraform plan -input=false -out=tfplan

      - name: Apply
        run: terraform apply -input=false tfplan

      - name: Smoke test (dry-run invocation)
        run: |
          metadata=$(aws lambda invoke \
            --function-name "$(terraform output -raw function_name)" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"dry_run": true}' \
            response.json)
          cat response.json
          if echo "$metadata" | grep -q FunctionError; then
            echo "::error::Smoke test failed"; exit 1
          fi
